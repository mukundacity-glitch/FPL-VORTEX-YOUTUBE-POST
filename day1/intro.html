<!doctype html><html><head><meta charset="utf-8"><title>FPL Vortex · Match roundup</title><style>
*{box-sizing:border-box}html,body{margin:0;width:3840px;height:2160px;overflow:hidden;background:#020711;color:#fff;font-family:Inter,Arial,Helvetica,sans-serif}
.scene{position:relative;width:3840px;height:2160px;overflow:hidden;background:radial-gradient(circle at 82% 8%,rgba(0,218,255,.20),transparent 28%),radial-gradient(circle at 12% 84%,rgba(0,245,160,.12),transparent 31%),linear-gradient(145deg,#020713 0%,#07182b 52%,#020711 100%)}
.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:96px 96px;opacity:.28}
.beam{position:absolute;width:3400px;height:110px;left:-500px;top:580px;transform:rotate(-34deg);background:linear-gradient(90deg,transparent,#11a8ff44,#47e7ff99,transparent);filter:blur(30px)}
header{position:absolute;left:100px;right:100px;top:60px;height:220px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #39ddff55;padding-bottom:34px}
.logo{height:170px;max-width:500px;object-fit:contain}.brand{font-size:88px;font-weight:1000;font-style:italic;letter-spacing:-2px}.brand b{color:#ffd447}.season{font-size:34px;font-weight:800;color:#a8c5d6;letter-spacing:6px}.pill{border:2px solid #3adeff88;border-radius:30px;padding:28px 42px;background:#081c2e;font-size:40px;font-weight:900;letter-spacing:4px}
.welcome{position:absolute;left:160px;right:160px;top:580px;text-align:center}.eyebrow{color:#35e6ff;font-size:40px;font-weight:900;letter-spacing:10px}.welcome h1{font-size:182px;line-height:1.02;font-weight:1000;letter-spacing:-5px;margin:45px 0}.welcome h1 span{color:#ffd447}.welcome p{font-size:58px;color:#bbd5e6;line-height:1.5;max-width:2700px;margin:30px auto}
.welcome.withPlayer{left:120px;right:1580px;top:650px}.welcome.withPlayer h1{font-size:120px}.welcome.withPlayer p{font-size:43px}.match{position:absolute;left:120px;top:430px;width:3600px;height:1160px;border:3px solid #37dfffbb;border-radius:46px;background:linear-gradient(135deg,#08233ee6,#020a18f5);box-shadow:0 0 60px #0ea4ff26,0 50px 100px #0008;padding:70px;transform-origin:50% 50%}
.match.withPlayer{width:2180px;height:1120px;top:515px}.meta{display:flex;justify-content:space-between;gap:20px;color:#a8dcef;font-size:37px;font-weight:800;letter-spacing:3px}.status{color:#52f28c}.status.pending{color:#ffd447}.status.live{color:#ff7594}
.scoreboard{height:720px;display:grid;grid-template-columns:1fr 600px 1fr;align-items:center;text-align:center}.withPlayer .scoreboard{grid-template-columns:1fr 440px 1fr;height:650px}.crest{height:285px;max-width:310px;object-fit:contain;filter:drop-shadow(0 15px 20px #0008)}.club{font-size:62px;font-weight:1000;line-height:1.1;margin-top:40px;min-height:140px;display:flex;align-items:center;justify-content:center}.withPlayer .club{font-size:50px}.score{font-size:190px;font-weight:1000;letter-spacing:-8px;color:#fff;text-shadow:0 0 55px #14a4ff88}.withPlayer .score{font-size:150px}.versus{font-size:112px;color:#ffd447}.matchFoot{border-top:2px solid #ffffff22;text-align:center;padding-top:30px;font-size:37px;color:#a9c5d9;font-weight:800;letter-spacing:3px}
.player{position:absolute;top:340px;right:120px;width:1300px;height:1640px;border:4px solid #b567ff;border-radius:48px;overflow:hidden;background:radial-gradient(circle at 20% 30%,#183ca9aa,transparent 50%),linear-gradient(145deg,#080d30,#16002e 75%);box-shadow:0 0 25px #b52cff88,0 0 70px #107cff44,0 30px 70px #0009;transform-origin:90% 50%}
.position{padding:22px 36px;background:linear-gradient(100deg,#4a13c9,#c310ec);font-size:38px;font-weight:1000;letter-spacing:4px;display:flex;justify-content:space-between}.profile{height:420px;position:relative;padding:42px 35px 20px 410px}.portrait{position:absolute;left:0;bottom:0;width:400px;height:420px;object-fit:contain;object-position:center bottom}.identity{position:relative;z-index:2}.first{font-size:39px;line-height:1;font-weight:900}.last{white-space:nowrap;overflow:hidden;font-size:68px;line-height:1.02;margin-top:8px;font-weight:1000;color:#fff}.team{font-size:28px;font-weight:900;padding:10px 14px;background:linear-gradient(90deg,#7429ee,transparent);margin-top:14px}.priceRow{display:flex;gap:15px;margin-top:26px}.priceRow>div{flex:1;background:#4510a8;border:1px solid #b565ff;border-radius:16px;padding:16px;font-size:22px;font-weight:800}.priceRow strong{display:block;color:#ffe93c;font-size:43px;margin-top:8px}.stats{padding:15px 28px;display:grid;gap:13px}.stat{display:flex;align-items:center;justify-content:space-between;border:1px solid #8228ff;border-radius:23px;background:#03030fcf;padding:13px 24px;min-height:84px;font-size:29px;font-weight:900}.stat strong{font-size:47px;color:#ffe63a}.nextLabel{font-size:31px;font-weight:1000;background:linear-gradient(90deg,#a517f2,#452de8);padding:17px 30px;margin:8px 27px 0;border-radius:15px 15px 0 0}.fixtures{margin:0 27px;display:grid;grid-template-columns:repeat(5,1fr);border:2px solid #7e40ed;border-radius:0 0 22px 22px;background:#070927;min-height:205px}.fixture{padding:16px 6px;text-align:center;min-width:0;border-right:1px solid #5b3290;display:flex;flex-direction:column;align-items:center;gap:8px}.fixture:last-child{border:0}.fixture small{color:#a9a8d8;font-size:20px}.fixture span{font-size:23px;font-weight:900}.fixtureBadge{width:48px;height:48px;object-fit:contain}.fdr{padding:7px 14px;border-radius:9px;font-size:28px;font-weight:1000;color:#02121c;display:inline-block}.fdr1{background:#00bf8e}.fdr2{background:#37ed74}.fdr3{background:#ffe33b}.fdr4{background:#ff9d38}.fdr5{background:#ff6279}.fdr0{background:#657080;color:white}.warning{margin:17px 28px;color:#ffca65;font-size:25px;font-weight:800;line-height:1.2;min-height:62px}.legend{font-size:22px;color:#bbb6d8;margin:8px 28px}.legend b{color:#35e6ff}
.caption{position:absolute;left:160px;right:160px;bottom:130px;min-height:100px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:49px;line-height:1.3;font-weight:800;color:white;text-shadow:0 3px 8px #000;background:#030d20dd;border:1px solid #ffffff22;border-radius:25px;padding:20px 35px;z-index:8}
footer{position:absolute;left:120px;right:120px;bottom:40px;display:flex;justify-content:space-between;color:#a3bfd3;font-size:30px;font-weight:900;letter-spacing:4px}.progress{position:absolute;left:0;bottom:0;height:7px;background:linear-gradient(90deg,#9b4bff,#35e6ff,#ffd447);width:0}.hidden{display:none!important}
</style></head><body><div class="scene"><div class="beam" id="beam"></div><header><div class="brand">__LOGO__ FPL <b>VORTEX</b></div><div class="season" id="season"></div><div class="pill" id="gw"></div></header><section class="welcome" id="welcome"><div class="eyebrow" id="eyebrow">THE GAMEWEEK, ONE MATCH AT A TIME</div><h1 id="welcomeTitle">THE RESULTS.<br><span>YOUR NEXT MOVE.</span></h1><p id="welcomeBody">Goals, bookings and availability — straight from the official match feeds.</p></section><section class="match hidden" id="match"></section><section class="player hidden" id="player"></section><div class="caption" id="caption"></div><footer><span>@FPLVORTEX</span><span>DATA · DECISION · POINTS · RANK CLIMB</span><span id="updated"></span></footer><div class="progress" id="progress"></div></div>
<script>
const DATA=__DATA__; const byId=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=(v,n=2)=>v==null?'—':Number(v).toFixed(n);const pic=(src,cls,alt)=>src?`<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}">`:`<div class="${cls}" style="display:grid;place-items:center;color:#b8d9ea;font-size:48px;font-weight:900" aria-label="Image unavailable">${esc(String(alt||"?").split(/\s+/).map(n=>n[0]).slice(0,2).join(""))}</div>`;
function fdr(v){return v==null?0:Math.max(1,Math.min(5,Math.round(v)));}
function playerHTML(p){const stats=[['xG PER 90',fmt(p.xg_per90)],['xA PER 90',fmt(p.xa_per90)],['GOALS PER 90',fmt(p.goals_per90)],['ASSISTS PER 90',fmt(p.assists_per90)],['NEXT FIXTURE · TEAM CS',p.clean_sheet_probability==null?'—':fmt(p.clean_sheet_probability*100,0)+'%'],['POINTS PER MATCH',fmt(p.points_per_match,1)]];return `<div class="position"><span>FPL VORTEX</span><span>${esc(p.position.toUpperCase())}</span></div><div class="profile">${pic(p.portrait,'portrait',p.name)}<div class="identity"><div class="first">${esc(p.first_name)}</div><div class="last">${esc(p.last_name)}</div><div class="team">${esc(p.club.toUpperCase())}</div><div class="priceRow"><div>PRICE<strong>${p.price==null?'—':'£'+fmt(p.price/10,1)+'m'}</strong></div><div>OWNERSHIP<strong>${fmt(p.ownership,1)}%</strong></div></div></div></div><div class="stats">${stats.map(([label,value])=>`<div class="stat"><span>${label}</span><strong>${value}</strong></div>`).join('')}</div><div class="nextLabel">NEXT ${p.fixtures.length} GAMEWEEKS</div><div class="fixtures">${p.fixtures.map(slot=>`<div class="fixture"><small>GW ${slot.gw}</small>${slot.fixtures.length?slot.fixtures.map(f=>`<span>${esc(f.opponent)} (${f.venue})</span>${pic(f.badge,'fixtureBadge',f.opponent)}<b class="fdr fdr${fdr(f.fdr)}">${fmt(f.fdr,2)}</b>`).join(''):'<span>BLANK</span><b class="fdr fdr0">—</b>'}</div>`).join('')}</div><div class="warning">${esc(p.warning||p.news||'')}</div><div class="legend"><b>WC/FH MODEL FDR</b> · 1 EASY → 5 HARD · TEAM CS FORECAST</div>`;}
function matchHTML(m){const score=m.status==='TO PLAY'?'VS':m.home_score==null||m.away_score==null?'—':`${m.home_score} – ${m.away_score}`;return `<div class="meta"><span>MATCH ${m.index} / ${m.count}</span><span>${esc(m.kickoff)}</span><span class="status ${m.status==='LIVE'?'live':m.status==='TO PLAY'?'pending':''}">${esc(m.status)}</span></div><div class="scoreboard"><div>${pic(m.home.badge,'crest',m.home.name)}<div class="club">${esc(m.home.name.toUpperCase())}</div></div><div class="score ${m.status==='TO PLAY'?'versus':''}">${score}</div><div>${pic(m.away.badge,'crest',m.away.name)}<div class="club">${esc(m.away.name.toUpperCase())}</div></div></div><div class="matchFoot">${m.status==='TO PLAY'?'OFFICIAL SCHEDULE · UK TIME':m.status==='LIVE'?'PROVISIONAL · MATCH IN PROGRESS':'OFFICIAL FULL-TIME RESULT'}</div>`;}
function fitNames(){document.querySelectorAll(".last,.first").forEach(el=>{let size=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&size>30){size-=2;el.style.fontSize=size+"px";}});}
let active=-1;window.__ready=false;
window.__seek=function(t){const found=DATA.beats.findIndex(b=>t>=b.t0&&t<b.t1);const i=found<0?(t>=DATA.duration?DATA.beats.length-1:0):found;const b=DATA.beats[i];const age=Math.max(0,t-b.t0);if(active!==i){active=i;byId('gw').textContent='GAMEWEEK '+DATA.gw;byId('season').textContent=DATA.season+' PREMIER LEAGUE';byId('updated').textContent=DATA.updated;byId('welcome').classList.toggle('hidden',!!b.match);byId('match').classList.toggle('hidden',!b.match);if(b.match)byId('match').innerHTML=matchHTML(b.match);byId('player').innerHTML=b.card?playerHTML(b.card):'';byId('eyebrow').textContent=b.kind==='rule'?'THE BOOKING RULE':b.kind==='handoff'?'NEXT · MY GAMEWEEK REVIEW':'THE GAMEWEEK, ONE MATCH AT A TIME';byId('welcomeTitle').innerHTML=b.kind==='rule'?'ONE BOOKING AWAY.<br><span>KNOW THE CUTOFF.</span>':b.kind==='handoff'?'THE LEAGUE PICTURE.<br><span>NOW, MY SQUAD.</span>':'THE RESULTS.<br><span>YOUR NEXT MOVE.</span>';byId('welcomeBody').textContent=b.kind==='rule'?'Cautions have competition-specific cutoffs. Check the confirmed suspension before a transfer.':b.kind==='handoff'?'Formation, captaincy, returns and what is still to play.':'Goals, bookings and availability — straight from the official match feeds.';}
const mention=(b.mentions||[]).findLast(m=>age>=m.name_time);const selected=mention||b;const cardKey=selected.player_id||0;if(window.cardKey!==cardKey){window.cardKey=cardKey;byId('player').innerHTML=selected.card?playerHTML(selected.card):'';}const show=!!selected.card&&age>=selected.name_time;byId('player').classList.toggle('hidden',!show);if(show)fitNames();byId('match').classList.toggle('withPlayer',show);byId('welcome').classList.toggle('withPlayer',show);const ease=1-Math.pow(1-Math.min(1,age/.55),3);byId('match').style.transform=`translateY(${(1-ease)*45}px) scale(${.97+.03*ease})`;if(show){const e=1-Math.pow(1-Math.min(1,(age-selected.name_time)/.4),3);byId('player').style.opacity=.2+.8*e;byId('player').style.transform=`translateX(${(1-e)*95}px) scale(${.96+.04*e})`;}
const words=b.words||[];let wi=words.findIndex(w=>age>=w.start&&age<w.start+w.duration);if(wi<0)wi=Math.max(0,words.findLastIndex(w=>age>=w.start));const group=Math.floor(wi/13)*13;byId('caption').textContent=words.length?words.slice(group,group+13).map(w=>w.text).join(' '):b.text;byId('progress').style.width=Math.min(100,t/DATA.duration*100)+'%';byId('beam').style.opacity=.7+.25*Math.sin(t*1.4);return {index:i,player_id:show?selected.player_id:null,fixture_id:b.match?.fixture_id??null,text:b.text};};
Promise.all([...document.images].map(img=>img.decode().catch(()=>{}))).then(()=>{window.__ready=true;window.__seek(0)});
</script></body></html>
