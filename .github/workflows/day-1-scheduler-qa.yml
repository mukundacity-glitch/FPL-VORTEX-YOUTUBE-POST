name: Day 1 scheduler contracts (no production)
on:
  push:
    branches: [main, codex/day1-five-scene-verification]
    paths:
      - 'vortex/day1_schedule_gate.py'
      - 'vortex/day1_scheduler.py'
      - 'tests/test_day1_scheduler.py'
      - '.github/workflows/day-1-scheduler.yml'
      - '.github/workflows/day-1-scheduler-qa.yml'
  pull_request:
    paths:
      - 'vortex/day1_schedule_gate.py'
      - 'vortex/day1_scheduler.py'
      - 'tests/test_day1_scheduler.py'
      - '.github/workflows/day-1-scheduler.yml'
      - '.github/workflows/day-1-scheduler-qa.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_day1_scheduler.py' -v
