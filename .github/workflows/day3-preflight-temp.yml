name: Day 3 preflight (temporary)
on:
  push:
    branches:
      - arena/88db8f2e-fpl-vortex-youtube-post
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg rclone

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "requests>=2.32,<3" \
            "pandas>=2.2,<3" \
            "numpy>=2.0,<3" \
            "pyarrow>=17,<21" \
            "Pillow>=10.4,<12" \
            "scipy>=1.14,<2" \
            "matplotlib>=3.9,<4" \
            "ipython>=8.27,<10" \
            "ipywidgets>=8.1,<9" \
            "playwright>=1.46,<2" \
            "edge-tts==7.2.8" \
            "beautifulsoup4>=4.12,<5" \
            "opencv-python-headless>=4.10,<5" \
            "google-api-python-client>=2.147,<3" \
            "google-auth>=2.35,<3" \
            "google-auth-httplib2>=0.2,<1"

      - name: Download production Day 3 notebook
        shell: bash
        run: |
          curl -fL --retry 3 -o /tmp/fpl-vortex-day3-final.ipynb \
            'https://drive.usercontent.google.com/download?id=1zKWruOYPPstyyr42y6q-MKwE3-6qTh0s&export=download'
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/fpl-vortex-day3-final.ipynb')
          notebook = json.loads(path.read_text(encoding='utf-8'))
          cells = notebook.get('cells')
          if not isinstance(cells, list) or len(cells) < 30:
              raise SystemExit('Downloaded Drive file is not the expected final Day 3 notebook.')
          print(f'Final Day 3 notebook downloaded: {len(cells)} cells')
          PY

      - name: Test Day 3 runtime guards
        shell: bash
        run: python -m unittest discover -s day3 -p 'test_*.py' -v

      - name: Validate all patched notebook cells
        shell: bash
        run: python day3/run_notebook.py /tmp/fpl-vortex-day3-final.ipynb --validate-only
