name: Day 1 private upload deduplication QA (no YouTube upload)

on:
  push:
    branches: [main]
    paths:
      - "vortex/youtube_private_upload.py"
      - "vortex/day1_upload_status.py"
      - "vortex/youtube_studio_package.py"
      - "day2/youtube.py"
      - "day3/publish_private.py"
      - "vortex/expert_editorial.py"
      - "vortex/allaboutfpl_verified_opinions.json"
      - "vortex/day1_editorial.py"
      - "day2/run_notebook.py"
      - "day3/run_notebook.py"
      - "tests/test_expert_editorial.py"
      - ".github/workflows/day-2.yml"
      - ".github/workflows/day-3.yml"
      - "tests/test_day1_season_dedup.py"
      - "tests/test_day1_upload_status.py"
      - ".github/workflows/day-1.yml"
      - ".github/workflows/day1-private-upload-qa.yml"
  pull_request:
    paths:
      - "vortex/youtube_private_upload.py"
      - "vortex/day1_upload_status.py"
      - "vortex/youtube_studio_package.py"
      - "day2/youtube.py"
      - "day3/publish_private.py"
      - "vortex/expert_editorial.py"
      - "vortex/allaboutfpl_verified_opinions.json"
      - "vortex/day1_editorial.py"
      - "day2/run_notebook.py"
      - "day3/run_notebook.py"
      - "tests/test_expert_editorial.py"
      - ".github/workflows/day-2.yml"
      - ".github/workflows/day-3.yml"
      - "tests/test_day1_season_dedup.py"
      - "tests/test_day1_upload_status.py"
      - ".github/workflows/day-1.yml"
      - ".github/workflows/day1-private-upload-qa.yml"

permissions:
  contents: read

jobs:
  private-draft-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify private draft detection and preserve public uploads
        run: python -m unittest discover -s tests -p 'test_day1_season_dedup.py' -v
      - name: Reject successful workflows without a private YouTube draft
        run: python -m unittest discover -s tests -p 'test_day1_upload_status.py' -v
      - name: Guard current gameweek and attributable editorial source
        run: python -m unittest discover -s tests -p 'test_expert_editorial.py' -v
      - name: Compile unchanged media runner with external-editorial integration
        run: python -m py_compile vortex/expert_editorial.py vortex/day1_editorial.py day2/run_notebook.py day3/run_notebook.py vortex/youtube_studio_package.py day2/youtube.py day3/publish_private.py
