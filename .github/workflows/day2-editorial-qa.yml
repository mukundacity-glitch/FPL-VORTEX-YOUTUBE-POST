name: Day 2 editorial, sourcing and premium broadcast QA (no video upload)

on:
  pull_request:
    paths:
      - ".github/workflows/day-2.yml"
      - ".github/workflows/day2-editorial-qa.yml"
      - "day2/**"
      - "tests/test_day2_editorial_release.py"
      - "vortex/day1_live_editorial.py"

permissions:
  contents: read

jobs:
  day2-editorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Day 2 runner, data, metadata and graphics
        run: |
          python -m py_compile day2/run_notebook.py day2/editorial.py day2/release_contract.py day2/youtube.py day2/visuals.py
      - name: Verify automatic live opinions, model identity, private metadata and broadcast design
        run: python -m unittest discover -s tests -p 'test_day2_editorial_release.py' -v
      - name: Verify no static GW10 recommendations in Day 2 runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path(".github/workflows/day-2.yml").read_text()
          runner = Path("day2/run_notebook.py").read_text()
          assert "python -m vortex.day1_live_editorial" in wf
          assert "from vortex.expert_editorial import narrator_note" not in runner
          assert "GW10" not in Path("day2/editorial.py").read_text()
          print("No hardcoded day-specific player recommendation source: PASS")
          PY
