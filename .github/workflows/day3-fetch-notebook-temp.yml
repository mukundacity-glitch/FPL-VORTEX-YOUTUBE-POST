name: Day 3 notebook fetch (temporary)

on:
  push:
    branches:
      - arena/dfa6b200-fpl-vortex-youtube-post
    paths:
      - .github/workflows/day3-fetch-notebook-temp.yml

permissions:
  contents: read

jobs:
  fetch:
    name: Fetch production notebook
    runs-on: ubuntu-24.04
    steps:
      - name: Download public production notebook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notebook"
          url="https://drive.usercontent.google.com/download?id=1zKWruOYPPstyyr42y6q-MKwE3-6qTh0s&export=download"
          curl -fsSL --retry 4 --retry-delay 3 --max-time 180 "$url" -o "$RUNNER_TEMP/notebook/day3-final.ipynb"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "notebook" / "day3-final.ipynb"
          data = json.loads(path.read_text(encoding="utf-8"))
          cells = data.get("cells")
          if not isinstance(cells, list) or len(cells) < 30:
              raise SystemExit("Unexpected notebook")
          print(f"Downloaded production notebook: {len(cells)} cells, {path.stat().st_size} bytes")
          PY

      - name: Print squad / MY PLAN code context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "notebook" / "day3-final.ipynb"
          data = json.loads(path.read_text(encoding="utf-8"))
          cells = [c for c in data["cells"] if c.get("cell_type") == "code"]
          keywords = [
              "MY_PLAN_MANUAL_OUT_PLAYER_IDS", "MY_PLAN_MANUAL_IN_PLAYER_IDS",
              "MY_PLAN_TEAM_SOURCE", "VX_MY_PLAN_PICKER_STATE", "squad_ids",
              "final_ids", "FPL_TEAM_ID", "ENTRY_ID", "/picks/",
              "current_squad", "CURRENT_SQUAD", "MY_PLAN_TRANSFER_SELECTION",
              "VX_MY_PLAN_SELECTION_READY", "_vx_resolve_permanent_public_squad",
              "MY_PLAN_SELECTION_MODE", "PLAYERS =", "ACCOUNT =",
          ]
          pat = re.compile("|".join(re.escape(k) for k in keywords))
          print("=== CELL INDEX ===")
          for i, cell in enumerate(cells):
              src = "".join(cell.get("source", []))
              lines = src.splitlines()
              hits = [n for n, line in enumerate(lines) if pat.search(line)]
              title = next((l.strip() for l in lines[:12] if l.strip().startswith("#@title")), lines[0][:100] if lines else "")
              print(f"CELL {i:>2} | {len(lines):>5} lines | {len(hits):>4} hits | {title[:110]}")
          print("=== MATCH CONTEXT ===")
          for i, cell in enumerate(cells):
              lines = "".join(cell.get("source", [])).splitlines()
              wanted = set()
              for n, line in enumerate(lines):
                  if pat.search(line):
                      wanted.update(range(max(0, n - 6), min(len(lines), n + 7)))
              if not wanted:
                  continue
              print(f"--- CELL {i} ({len(lines)} lines, {len(wanted)} context lines) ---")
              last = -2
              for n in sorted(wanted):
                  if n > last + 1:
                      print("    ...")
                  print(f"C{i}:{n+1}: {lines[n]}")
                  last = n
          print("=== END MATCH CONTEXT ===")
          PY

      - name: Upload notebook artifact
        uses: actions/upload-artifact@v4
        with:
          name: day3-production-notebook
          path: ${{ runner.temp }}/notebook/day3-final.ipynb
          if-no-files-found: error
          retention-days: 3
