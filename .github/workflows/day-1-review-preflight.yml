name: Day 1 Review Preflight

on:
  push:
    branches: [main]
    paths:
      - "1_final_day1.py"
      - "tests/test_day1_review_contract.py"
      - "tests/test_day1_narration_sync.py"
      - ".github/workflows/day-1-review-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-preflight:
    name: Review narration and animation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Day 1 narration and review contracts
        run: python -m unittest discover -s tests -p 'test_day1*.py' -v
