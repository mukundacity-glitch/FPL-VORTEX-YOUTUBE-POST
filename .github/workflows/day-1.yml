name: Day 1

on:
  workflow_dispatch:
    inputs:
      upload_from_run_id:
        description: "Upload only: paste the successful Day 1 run ID (blank renders a new video)"
        type: string
        required: false
        default: ""
  pull_request:
    paths:
      - "1_final_day1.py"
      - "vortex/day1_editorial.py"
      - "vortex/day1_live_editorial.py"
      - "vortex/expert_editorial.py"
      - "vortex/day1_agenda.py"
      - "vortex/day1_brief.py"
      - "vortex/day1_brief.html"
      - "vortex/day1_media.py"
      - "tests/test_day1_brief*.py"
      - "vortex/youtube_studio_package.py"
      - "tests/test_day1_live_editorial.py"
      - "tests/test_day1_editorial*.py"
      - "tests/test_day1_agenda.py"
      - "tests/test_day1_intro_voice_gate.py"
      - "tests/test_day1_runner_diagnostics.py"
      - "tests/test_day1_publish_contract.py"
      - "tests/test_day1_player_card.py"
      - "vortex/day1_publish_contract.py"
      - "vortex/day1_market_desk.py"
      - "tests/test_day1_market_desk.py"
      - "tests/test_day1_season_dedup.py"
      - "tests/test_day1_soft_duration.py"
      - "day3/transfer_desk.py"
      - "tools/hero_card_audit/**"
      - ".github/workflows/day-1.yml"
      - "vortex/youtube_private_upload.py"
      - "vortex/day1_upload_status.py"
      - "day2/youtube.py"
      - "day3/publish_private.py"
      - "vortex/allaboutfpl_verified_opinions.json"
      - "day2/run_notebook.py"
      - "day3/run_notebook.py"
      - "tests/test_expert_editorial.py"
      - ".github/workflows/day-2.yml"
      - ".github/workflows/day-3.yml"
      - "tests/test_day1_upload_status.py"
      - "tests/test_day1_scene2_renderer_integration.py"
      - "vortex/day1_scene2_restore.py"
      - "vortex/day1_scene2_runtime.js"
      - "vortex/day1_scene2_data_panels.js"
      - "tests/test_day1_scene2_restore.py"
  push:
    branches:
      - main
    paths:
      - "vortex/youtube_private_upload.py"
      - "vortex/day1_upload_status.py"
      - "vortex/youtube_studio_package.py"
      - "day2/youtube.py"
      - "day3/publish_private.py"
      - "vortex/expert_editorial.py"
      - "vortex/allaboutfpl_verified_opinions.json"
      - "vortex/day1_editorial.py"
      - "day2/run_notebook.py"
      - "day3/run_notebook.py"
      - "tests/test_expert_editorial.py"
      - ".github/workflows/day-2.yml"
      - ".github/workflows/day-3.yml"
      - "tests/test_day1_season_dedup.py"
      - "tests/test_day1_upload_status.py"
      - ".github/workflows/day-1.yml"

permissions:
  contents: read

jobs:
  run-day-1:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_from_run_id == ''
    concurrency:
      group: fpl-vortex-day-1
      cancel-in-progress: false

    env:
      PYTHONUNBUFFERED: "1"
      VORTEX_DAY1_VIDEO_TARGET_SECONDS: "330"
      SOURCE_FILE: 1_final_day1.py
      DAY1_ASSET_FOLDER_ID: 1h3Loznr5RnsMyh-kUd-zMxEgOf98uFSt
      DAY1_ASSET_DIR: /content/drive/MyDrive/FPL_VORTEX/Assets
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
      YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    name: Run Day 1
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Clone Day 1 FPL Core data
        uses: actions/checkout@v7
        with:
          repository: lukegiuseppin/fpl
          path: .day1-fpl-source
          sparse-checkout: data
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify untouched Day 1 source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- "${SOURCE_FILE}"
          source_sha256="$(sha256sum "${SOURCE_FILE}" | awk '{print $1}')"
          echo "SOURCE_SHA256=${source_sha256}" >> "${GITHUB_ENV}"
          echo "Day 1 source baseline SHA256: ${source_sha256}"
          python - <<'PY'
          import ast
          import os
          import re
          from pathlib import Path

          source_path = Path(os.environ["SOURCE_FILE"])
          source = source_path.read_text(encoding="utf-8")
          marker = re.compile(
              r"(?m)(?=^# ={20,}\n# [^\n]*\bCELL\s+\d+[A-Za-z]?\b[^\n]*\n)"
          )
          cells = [part for part in marker.split(source) if part.strip()]
          if len(cells) != 33:
              raise SystemExit(f"Expected 33 Day 1 cell blocks, found {len(cells)}")
          for index, cell in enumerate(cells, 1):
              compile(
                  cell,
                  f"{source_path.name}::cell-{index}",
                  "exec",
                  flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT,
                  dont_inherit=True,
              )
          print("Day 1 integrity and 33-cell syntax check: PASS")
          PY

          python -m unittest discover -s tests -p 'test_day1_narration_sync.py' -v
          python -m unittest discover -s tests -p 'test_day1_review_contract.py' -v
          python -m unittest discover -s tests -p 'test_day1_editorial.py' -v
          python -m unittest discover -s tests -p 'test_day1_agenda.py' -v
          python -m unittest discover -s tests -p 'test_day1_brief.py' -v
          python -m unittest discover -s tests -p 'test_day1_intro_voice_gate.py' -v
          python -m unittest discover -s tests -p 'test_day1_editorial_integration.py' -v
          python -m unittest discover -s tests -p 'test_day1_soft_duration.py' -v
          python -m unittest discover -s tests -p 'test_day1_runner_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_day1_publish_contract.py' -v
          python -m unittest discover -s tests -p 'test_day1_season_dedup.py' -v
          python -m unittest discover -s tests -p 'test_day1_player_card.py' -v
          python -m unittest discover -s tests -p 'test_day1_value_board.py' -v

      - name: Verify private YouTube upload configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          client_id = (
              os.environ.get("YOUTUBE_OAUTH_CLIENT_ID")
              or os.environ.get("GOOGLE_OAUTH_CLIENT_ID")
              or ""
          ).strip()
          client_secret = (
              os.environ.get("YOUTUBE_OAUTH_CLIENT_SECRET")
              or os.environ.get("GOOGLE_OAUTH_CLIENT_SECRET")
              or ""
          ).strip()
          refresh_token = (os.environ.get("YOUTUBE_OAUTH_REFRESH_TOKEN") or "").strip()
          channel_id = (os.environ.get("YOUTUBE_CHANNEL_ID") or "").strip()

          missing = []
          if not client_id:
              missing.append("YOUTUBE_OAUTH_CLIENT_ID or GOOGLE_OAUTH_CLIENT_ID")
          if not client_secret:
              missing.append(
                  "YOUTUBE_OAUTH_CLIENT_SECRET or GOOGLE_OAUTH_CLIENT_SECRET"
              )
          if not refresh_token:
              missing.append("YOUTUBE_OAUTH_REFRESH_TOKEN")
          if not channel_id:
              missing.append("YOUTUBE_CHANNEL_ID")
          if missing:
              raise SystemExit(
                  "Missing required private YouTube upload secret(s): "
                  + ", ".join(missing)
              )
          if not client_id.endswith(".apps.googleusercontent.com"):
              raise SystemExit("YouTube OAuth client ID has an invalid format")
          if not re.fullmatch(r"UC[A-Za-z0-9_-]{22}", channel_id):
              raise SystemExit("YOUTUBE_CHANNEL_ID has an invalid format")
          print("Private YouTube upload configuration: PASS")
          print("Automatic Public/Unlisted/scheduled publishing: DISABLED")
          PY

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg rclone

      - name: Test Day 1 asset and logo recovery contracts
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_day1_asset_restore.py' -v
          python -m unittest discover -s tests -p 'test_day1_logo_restore.py' -v

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "requests>=2.32,<3" \
            "pandas>=2.2,<3" \
            "numpy>=2.0,<3" \
            "pyarrow>=17,<20" \
            "Pillow>=10.4,<12" \
            "scipy>=1.14,<2" \
            "matplotlib>=3.9,<4" \
            "ipython>=8.27,<10" \
            "playwright>=1.46,<2" \
            "edge-tts==7.3.1" \
            "google-api-python-client>=2.147,<3" \
            "google-auth>=2.35,<3" \
            "google-auth-httplib2>=0.2,<1"
          python -m unittest discover -s tests -p 'test_day1_source_loader.py' -v
          python -m unittest discover -s tests -p 'test_day1_market_desk.py' -v
          python -m unittest discover -s tests -p 'test_day1_value_live.py' -v
          # Broadcast imports Pillow; validate it only after Python dependencies exist.
          python -m unittest discover -s tests -p 'test_day1_broadcast.py' -v

      - name: Install Chromium runtime
        shell: bash
        run: python -m playwright install --with-deps chromium

      - name: Configure private Google Drive connection
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          secret_names = (
              "GOOGLE_OAUTH_CLIENT_ID",
              "GOOGLE_OAUTH_CLIENT_SECRET",
              "GOOGLE_OAUTH_REFRESH_TOKEN",
          )
          secrets = {
              name: (os.environ.get(name) or "").strip()
              for name in secret_names
          }
          missing = [name for name, value in secrets.items() if not value]
          if missing:
              raise SystemExit(
                  "Missing required GitHub secret(s): " + ", ".join(missing)
              )
          if not secrets["GOOGLE_OAUTH_CLIENT_ID"].endswith(
              ".apps.googleusercontent.com"
          ):
              raise SystemExit("GOOGLE_OAUTH_CLIENT_ID has an invalid format")

          request_data = urllib.parse.urlencode(
              {
                  "client_id": secrets["GOOGLE_OAUTH_CLIENT_ID"],
                  "client_secret": secrets["GOOGLE_OAUTH_CLIENT_SECRET"],
                  "refresh_token": secrets["GOOGLE_OAUTH_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=request_data,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              refreshed = json.loads(response.read().decode("utf-8"))

          expires_in = int(refreshed.get("expires_in", 3600))
          token = {
              "access_token": refreshed["access_token"],
              "token_type": refreshed.get("token_type", "Bearer"),
              "refresh_token": secrets["GOOGLE_OAUTH_REFRESH_TOKEN"],
              "expiry": (
                  datetime.now(timezone.utc)
                  + timedelta(seconds=max(60, expires_in - 60))
              ).isoformat().replace("+00:00", "Z"),
          }

          config_dir = Path(os.environ["RUNNER_TEMP"]) / "rclone"
          config_dir.mkdir(parents=True, exist_ok=True)
          config_path = config_dir / "rclone.conf"
          token_json = json.dumps(token, separators=(",", ":"))
          config_path.write_text(
              "\n".join(
                  (
                      "[vortex-drive]",
                      "type = drive",
                      f"client_id = {secrets['GOOGLE_OAUTH_CLIENT_ID']}",
                      f"client_secret = {secrets['GOOGLE_OAUTH_CLIENT_SECRET']}",
                      "scope = drive",
                      "token = " + token_json,
                      "",
                      "[day1-assets]",
                      "type = drive",
                      f"client_id = {secrets['GOOGLE_OAUTH_CLIENT_ID']}",
                      f"client_secret = {secrets['GOOGLE_OAUTH_CLIENT_SECRET']}",
                      "scope = drive",
                      "token = " + token_json,
                      f"root_folder_id = {os.environ['DAY1_ASSET_FOLDER_ID']}",
                      "",
                  )
              ),
              encoding="utf-8",
          )
          config_path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"RCLONE_CONFIG={config_path}\n")
          print("Google Drive OAuth connection: PASS")
          PY

      - name: Restore required Google Drive state
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /content/drive/MyDrive
          sudo chown -R "$(id -u):$(id -g)" /content

          restore_optional() {
            local remote_path="$1"
            local local_path="/content/drive/MyDrive/$1"
            if rclone lsf "vortex-drive:${remote_path}" --max-depth 1 >/dev/null 2>&1; then
              mkdir -p "${local_path}"
              rclone copy "vortex-drive:${remote_path}" "${local_path}" \
                --create-empty-src-dirs --transfers 4 --checkers 8
              echo "Restored My Drive/${remote_path}"
            else
              echo "Optional Drive path not present: My Drive/${remote_path}"
            fi
          }

          # Keep the notebook's existing path, backed by the original data
          # repository: the Drive archive can contain folders without CSVs.
          archive_path="/content/drive/MyDrive/FPL_VORTEX_DATA/00_SOURCE_ARCHIVE/FPL_CORE/data"
          source_data="${GITHUB_WORKSPACE}/.day1-fpl-source/data"
          test -d "${source_data}" || { echo "FPL repository data is missing" >&2; exit 1; }
          mkdir -p "$(dirname "${archive_path}")"
          ln -s "${source_data}" "${archive_path}"
          source_commit="$(git -C "${GITHUB_WORKSPACE}/.day1-fpl-source" rev-parse HEAD)"
          echo "Day 1 FPL source commit: ${source_commit}"

          # Fail early if approved media vanished; recover verified originals
          # from an independent Drive backup without altering notebook logic.
          bash scripts/restore_day1_assets.sh

          restore_optional "FPL_VORTEX/FIRST VIDEO"
          restore_optional "FPL_VORTEX/MODEL_INPUTS"
          restore_optional "FPL_VORTEX/DECISION_ENGINE"
          restore_optional "FPL_VORTEX/RAW_DATA"
          restore_optional "FPL_VORTEX/MODEL_HISTORY"
          restore_optional "FPL_VORTEX/elements"
          restore_optional "elements"
          restore_optional "FPL_VORTEX_DATA/03_ELITE_MANAGERS"
          restore_optional "FPL_VORTEX_DATA/04_MASTER"
          restore_optional "FPL_VORTEX_DATA/05_MODEL_HISTORY"
          restore_optional "FPL_VORTEX_DATA/06_SNAPSHOTS"
          restore_optional "FPL_VORTEX_DATA/07_LOGS"

          # Google Drive's previous hard-coded logo file ID was deleted (404).
          # Preserve an existing logo, otherwise crop the original crest from
          # the approved opening.mp4. Never invent a brand image.
          bash scripts/restore_day1_logo.sh

      - name: Reset previous Day 1 outputs locally
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          output_root = Path(
              os.environ.get(
                  "DAY1_OUTPUT_ROOT",
                  "/content/drive/MyDrive/FPL_VORTEX/FIRST VIDEO",
              )
          )
          if str(output_root.resolve()) != "/content/drive/MyDrive/FPL_VORTEX/FIRST VIDEO":
              raise SystemExit(f"Unsafe output reset target: {output_root}")

          for name in ("MP4", "MP3", "SLIDE", "DATA"):
              folder = output_root / name
              folder.mkdir(parents=True, exist_ok=True)
              for child in folder.iterdir():
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()

          print("Previous Day 1 outputs cleared; folder structure preserved")
          PY

      - name: Research current AllAboutFPL article recommendations for Day 1
        shell: bash
        run: |
          # Current-GW live extraction; never consume a hard-coded opinion file.
          brief="${RUNNER_TEMP}/day1_editorial_sources.json"
          python -m vortex.day1_live_editorial --output "${brief}"
          echo "VORTEX_EDITORIAL_BRIEF=${brief}" >> "${GITHUB_ENV}"
          install -Dm644 "${brief}" "/content/drive/MyDrive/FPL_VORTEX/FIRST VIDEO/DATA/day1_editorial_sources.json"
          echo "[DAY1 EXPERT] Source report archived in Day 1 DATA"

      - name: Prepare Colab compatibility layer
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          compat_root = Path(os.environ["RUNNER_TEMP"]) / "colab-compat"
          package = compat_root / "google" / "colab"
          package.mkdir(parents=True, exist_ok=True)
          (compat_root / "google" / "__init__.py").write_text(
              "from pkgutil import extend_path\n"
              "__path__ = extend_path(__path__, __name__)\n",
              encoding="utf-8",
          )
          (package / "__init__.py").write_text(
              "from . import drive, output, userdata\n",
              encoding="utf-8",
          )
          (package / "drive.py").write_text(
              "from pathlib import Path\n\n"
              "def mount(mountpoint, **kwargs):\n"
              "    root = Path(mountpoint)\n"
              "    (root / 'MyDrive').mkdir(parents=True, exist_ok=True)\n"
              "    return None\n\n"
              "def flush_and_unmount():\n"
              "    return None\n",
              encoding="utf-8",
          )
          (package / "userdata.py").write_text(
              "import os\n\n"
              "def get(name):\n"
              "    return os.environ.get(str(name))\n",
              encoding="utf-8",
          )
          (package / "output.py").write_text(
              "def serve_kernel_port_as_iframe(*args, **kwargs):\n"
              "    print('Colab iframe preview skipped in GitHub Actions')\n\n"
              "def serve_kernel_port_as_window(*args, **kwargs):\n"
              "    print('Colab window preview skipped in GitHub Actions')\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"PYTHONPATH={compat_root}\n")
          print("Colab compatibility layer: PASS")
          PY

      - name: Set up Day 1 broadcast renderer
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
        working-directory: tools/day1-broadcast

      - name: Execute Day 1 cells once in order
        shell: bash
        env:
          VORTEX_DAY1_COMPACT: "1"
          VORTEX_DAY1_PREMIUM_BROADCAST: "1"
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "${RUNNER_TEMP}/day-1.log"
          import asyncio
          import hashlib
          import os
          import re
          from pathlib import Path

          import aiohttp
          import edge_tts
          from edge_tts import constants as edge_constants
          from edge_tts.drm import DRM
          from IPython.core.interactiveshell import InteractiveShell

          source_path = Path(os.environ["SOURCE_FILE"]).resolve()
          source_bytes = source_path.read_bytes()
          actual_hash = hashlib.sha256(source_bytes).hexdigest()
          expected_hash = os.environ["SOURCE_SHA256"]
          if actual_hash != expected_hash:
              raise SystemExit(
                  f"Source changed before execution: {actual_hash} != {expected_hash}"
              )

          source = source_bytes.decode("utf-8")
          marker = re.compile(
              r"(?m)(?=^# ={20,}\n# [^\n]*\bCELL\s+\d+[A-Za-z]?\b[^\n]*\n)"
          )
          cells = [part for part in marker.split(source) if part.strip()]
          if len(cells) != 33:
              raise SystemExit(f"Expected 33 Day 1 cell blocks, found {len(cells)}")

          # edge-tts 7.3.1 implements Microsoft's v2 Sec-MS-GEC token format.
          # Do not monkey-patch WSS_URL: the previous custom endpoint override
          # paired the new endpoint with the old v1 token and failed its handshake.
          if edge_tts.__version__ != "7.3.1":
              raise RuntimeError("Day 1 Edge transport requires edge-tts 7.3.1 (v2 token support)")
          if not edge_constants.SEC_MS_GEC_VERSION.startswith("2-"):
              raise RuntimeError("Day 1 Edge transport requires Sec-MS-GEC v2; check the edge-tts pin")
          gec_token = DRM.generate_sec_ms_gec()
          if not re.fullmatch(r"[0-9A-F]{16}-[0-9A-F]{64}", gec_token):
              raise RuntimeError("Day 1 Edge transport generated an invalid Sec-MS-GEC v2 token")

          async def verify_ryan_connection() -> None:
              last_error = None
              for attempt in range(1, 4):
                  audio_bytes = 0
                  word_count = 0
                  previous_offset = -1
                  try:
                      async for chunk in edge_tts.Communicate(
                          "Welcome to FPL Vortex. Read the game early.",
                          "en-GB-RyanNeural",
                          boundary="WordBoundary",
                          connect_timeout=10,
                          receive_timeout=20,
                      ).stream():
                          if chunk["type"] == "audio":
                              audio_bytes += len(chunk["data"])
                          elif chunk["type"] == "WordBoundary":
                              offset = int(chunk["offset"])
                              if offset < 0 or offset < previous_offset or int(chunk["duration"]) <= 0:
                                  raise RuntimeError("Invalid Ryan word-boundary timing")
                              previous_offset = offset
                              word_count += 1
                      if audio_bytes <= 0 or word_count <= 0:
                          raise RuntimeError("Day 1 Edge Ryan returned no audio or word timing")
                      print(f"Day 1 Edge Ryan connection: PASS ({audio_bytes} audio bytes, {word_count} words)")
                      return
                  except aiohttp.ClientResponseError as exc:
                      if exc.status not in {500, 502, 503, 504}:
                          raise
                      last_error = exc
                  except (aiohttp.ClientConnectionError, asyncio.TimeoutError) as exc:
                      last_error = exc

                  if attempt < 3:
                      delay = 2 ** attempt
                      print(
                          f"Transient Edge TTS transport error ({type(last_error).__name__}); "
                          f"retrying {attempt + 1}/3 in {delay}s",
                          flush=True,
                      )
                      await asyncio.sleep(delay)

              raise RuntimeError(
                  f"Day 1 Edge Ryan connection failed after 3 attempts ({type(last_error).__name__})"
              ) from last_error

          asyncio.run(verify_ryan_connection())

          shell = InteractiveShell.instance()
          shell.autoawait = True
          shell.user_ns["__name__"] = "__main__"

          import sys
          import traceback

          for index, cell in enumerate(cells, 1):
              label = next(
                  (
                      line.removeprefix("# ").strip()
                      for line in cell.splitlines()
                      if re.search(r"\bCELL\s+\d+[A-Za-z]?\b", line)
                  ),
                  "Notebook metadata",
              )
              print(f"::group::Day 1 block {index:02d}/33 — {label}", flush=True)
              try:
                  result = shell.run_cell(cell, store_history=False, silent=False)
              except Exception as err:
                  # A shell-level exception must also close the group before
                  # printing the complete traceback at top-level log visibility.
                  print("::endgroup::", flush=True)
                  print(f"::error::Block {index} ({label}): {type(err).__name__}: {err}", flush=True)
                  traceback.print_exception(type(err), err, err.__traceback__, file=sys.stdout)
                  sys.stdout.flush()
                  raise RuntimeError(f"Day 1 block {index} failed: {label}") from err
              print("::endgroup::", flush=True)

              err = result.error_before_exec or result.error_in_exec
              if err is not None or not result.success:
                  if err is not None:
                      print(f"::error::Block {index} ({label}): {type(err).__name__}: {err}", flush=True)
                      traceback.print_exception(type(err), err, err.__traceback__, file=sys.stdout)
                      sys.stdout.flush()
                  else:
                      print(f"::error::Block {index} ({label}): cell execution unsuccessful without an exception", flush=True)
                  raise RuntimeError(f"Day 1 block {index} failed: {label}") from err

          print("Day 1 execution: PASS")
          PY

      - name: Build and verify live Scene 05 Value Board (official FPL API)
        shell: bash
        run: |
          set -euo pipefail
          python -m vortex.day1_value_render
          python -m unittest discover -s tests -p 'test_day1_value_board.py' -v
          python -m unittest discover -s tests -p 'test_day1_broadcast.py' -v

      - name: Add opening and confirmed music mix
        shell: bash
        run: python -m vortex.day1_media

      - name: Build private YouTube metadata package
        shell: bash
        run: python -m vortex.youtube_studio_package

      - name: Validate Day 1 output
        shell: bash
        env:
          VORTEX_DAY1_COMPACT: "1"
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import subprocess
          from pathlib import Path

          root = Path("/content/drive/MyDrive/FPL_VORTEX/FIRST VIDEO")
          expected_dirs = {"MP4", "MP3", "SLIDE", "DATA"}
          if not root.is_dir():
              raise SystemExit(f"Output root is missing: {root}")
          actual_dirs = {path.name for path in root.iterdir() if path.is_dir()}
          root_files = [path.name for path in root.iterdir() if path.is_file()]
          if actual_dirs != expected_dirs or root_files:
              raise SystemExit(
                  f"Output structure invalid: dirs={sorted(actual_dirs)}, "
                  f"root_files={root_files}"
              )
          for name in sorted(expected_dirs):
              folder = root / name
              if not any(path.is_file() for path in folder.rglob("*")):
                  raise SystemExit(f"Expected output directory is empty: {folder}")

          qa_path = root / "DATA" / "final_video_qa.json"
          if not qa_path.is_file():
              raise SystemExit(f"Final QA file is missing: {qa_path}")
          qa = json.loads(qa_path.read_text(encoding="utf-8"))
          if (
              qa.get("passed") is not True
              or qa.get("output_contract", {}).get("passed") is not True
          ):
              raise SystemExit("Final video QA did not pass")
          expected_scene_keys = ["00_intro", "gw_review", "02_fdr", "03_projected_goals", "04_value_board"]
          if qa.get("scene_keys") != expected_scene_keys:
              raise SystemExit(f"Day 1 must contain all five verified scenes in order: {qa.get('scene_keys')}")

          scene5_qa = qa.get("scene05_verified") or {}
          if scene5_qa.get("squad") != 15 or scene5_qa.get("start_xi") != 11 or scene5_qa.get("bench") != 4:
              raise SystemExit("Scene 05 fifteen-player squad verification missing")
          if scene5_qa.get("frame_size") != [3840, 2160] or not scene5_qa.get("sha256"):
              raise SystemExit("Scene 05 4K source and hash verification missing")

          final_mp4s = [
              path for path in (root / "MP4").glob("*COMBINED*.mp4")
              if path.is_file()
          ]
          final_mp3s = [
              path for path in (root / "MP3").glob("*COMBINED*.mp3")
              if path.is_file()
          ]
          if len(final_mp4s) != 1 or len(final_mp3s) != 1:
              raise SystemExit(
                  "Expected exactly one combined final MP4 and MP3; "
                  f"found MP4={len(final_mp4s)}, MP3={len(final_mp3s)}"
              )
          # Duration is a SOFT 7-minute production preference, not a reason
          # to discard a fully verified render or accelerate Ryan's natural TTS.
          # Keep a positive-duration integrity check, preserve the real duration
          # in QA, and log an advisory when content exceeds the preferred cap.
          actual_seconds = float(subprocess.check_output(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration",
               "-of", "default=noprint_wrappers=1:nokey=1", str(final_mp4s[0])],
              text=True,
          ).strip())
          if not math.isfinite(actual_seconds) or actual_seconds <= 0:
              raise SystemExit("Day 1 final MP4 has missing or invalid duration")
          if actual_seconds > 420.0:
              print(f"ℹ️ Day 1 soft 7-minute goal exceeded: {actual_seconds:.2f}s. "
                    "Continuing with natural Ryan speed and verified video.")
          else:
              print(f"✅ Day 1 soft 7-minute goal met: {actual_seconds:.2f}s")

          # Editorial QA uses measured TTS boundaries and real video runtime.
          scene_keys = list(qa.get("scene_keys") or [])
          if "gw_review" in scene_keys and set(scene_keys) <= {"opening_video", "00_intro", "gw_review"}:
              qa_editorial = root / "DATA" / "gw_review_editorial_qa.json"
              script_file = root / "DATA" / "gw_review_final_script.txt"
              caption_file = root / "DATA" / "gw_review_master.vtt"
              for required in (qa_editorial, script_file, caption_file):
                  if not required.is_file() or required.stat().st_size <= 50:
                      raise SystemExit(f"Final editorial evidence missing: {required}")
              narration = json.loads(qa_editorial.read_text(encoding="utf-8"))
              if narration.get("within_target") is not True:
                  print(f"ℹ️ Soft narration pacing target missed: {narration}. "
                        "Natural Ryan rate preserved; output not discarded.")
              if "Expected points are forecasts, not guaranteed returns" not in script_file.read_text(encoding="utf-8"):
                  raise SystemExit("Review script disclosure was lost during final synthesis")
              captions = caption_file.read_text(encoding="utf-8")
              if not captions.startswith("WEBVTT") or captions.count(" --> ") < 20:
                  raise SystemExit("Measured word-level review captions are missing or incomplete")
              requested_seconds = float(os.getenv("VORTEX_DAY1_VIDEO_TARGET_SECONDS", "330"))
              if not 180 <= requested_seconds <= 390:
                  print(f"ℹ️ Advisory: Day 1 editorial pacing target is {requested_seconds:.2f}s")
              # Real measured MP4 duration is reported; no min/max runtime
              # failure is imposed on a correctly rendered 15-player episode.
              print(f"Day 1 humanized editorial QA: PASS, rendered={actual_seconds:.2f}s, "
                    f"narration={narration['audio_seconds']:.2f}s, "
                    f"captions={captions.count(' --> ')} cues")
          package_path = root / "DATA" / "youtube_video_1_of_3_package.json"
          if not package_path.is_file():
              raise SystemExit(f"YouTube Studio package is missing: {package_path}")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          if (
              package.get("manual_upload_only") is not False
              or package.get("youtube_api_upload_enabled") is not True
              or package.get("automatic_publication_enabled") is not False
          ):
              raise SystemExit("YouTube package is not locked to private API upload")
          expected_policy = {
              "privacy_status": "private",
              "notify_subscribers": False,
              "automatic_publish": False,
              "automatic_schedule": False,
              "manual_publication_required": True,
          }
          if package.get("upload_policy") != expected_policy:
              raise SystemExit("YouTube private-upload safety policy is invalid")

          metadata = package.get("metadata") or {}
          preview_gw = int(metadata.get("preview_gw") or 0)
          review_gw = int(metadata.get("review_gw") or 0)
          if not 1 <= preview_gw <= 38 or not 1 <= review_gw <= 38:
              raise SystemExit(
                  f"YouTube package has invalid dynamic GWs: {preview_gw}/{review_gw}"
              )
          if f"FPL GW{preview_gw}" not in str(metadata.get("title") or ""):
              raise SystemExit("YouTube title does not match its dynamic preview GW")
          if metadata.get("recommended_visibility") != "Private":
              raise SystemExit("YouTube Studio visibility must default to Private")
          visible_title = str(metadata.get("title") or "").upper()
          if "DAY 1" in visible_title or "DAY 2" in visible_title:
              raise SystemExit("YouTube title must not use Day numbering")

          print("Day 1 output structure, final QA, and private YouTube package: PASS")
          PY

      - name: Publish outputs and persistent state to Google Drive
        shell: bash
        run: |
          set -euo pipefail
          first_video_path="FPL_VORTEX/FIRST VIDEO"
          first_video_local="/content/drive/MyDrive/${first_video_path}"
          if [[ -d "${first_video_local}" ]]; then
            rclone sync "${first_video_local}" "vortex-drive:${first_video_path}" \
              --create-empty-src-dirs --transfers 4 --checkers 8
            echo "Replaced My Drive/${first_video_path} with the current output set"
          fi

          publish_if_present() {
            local drive_path="$1"
            local local_path="/content/drive/MyDrive/$1"
            if [[ -d "${local_path}" ]]; then
              rclone copy "${local_path}" "vortex-drive:${drive_path}" \
                --create-empty-src-dirs --transfers 4 --checkers 8
              echo "Published My Drive/${drive_path}"
            fi
          }

          publish_if_present "FPL_VORTEX/MODEL_INPUTS"
          publish_if_present "FPL_VORTEX/DECISION_ENGINE"
          publish_if_present "FPL_VORTEX/RAW_DATA"
          publish_if_present "FPL_VORTEX/MODEL_HISTORY"
          publish_if_present "FPL_VORTEX_DATA/05_MODEL_HISTORY"
          publish_if_present "FPL_VORTEX_DATA/06_SNAPSHOTS"
          publish_if_present "FPL_VORTEX_DATA/07_LOGS"

      - name: Upload final 4K video privately to YouTube
        shell: bash
        run: python -m vortex.youtube_private_upload

      - name: Confirm PRIVATE YouTube draft and show Studio link
        shell: bash
        run: python -m vortex.day1_upload_status

      - name: Save YouTube private-upload receipt to Google Drive
        if: always()
        shell: bash
        run: |
          receipt="/content/drive/MyDrive/FPL_VORTEX/FIRST VIDEO/DATA/youtube_private_upload.json"
          if [[ -s "${receipt}" ]]; then
            rclone copyto \
              "${receipt}" \
              "vortex-drive:FPL_VORTEX/FIRST VIDEO/DATA/youtube_private_upload.json"
            echo "Saved YouTube private-upload receipt to Google Drive"
          else
            echo "No YouTube private-upload receipt was created"
          fi

      - name: Upload Day 1 output artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day-1-output-${{ github.run_number }}
          path: /content/drive/MyDrive/FPL_VORTEX/FIRST VIDEO
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Upload Day 1 execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day-1-log-${{ github.run_number }}
          path: ${{ runner.temp }}/day-1.log
          if-no-files-found: warn
          retention-days: 14

  upload-existing-day-1:
    name: Upload existing Day 1 video privately
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.upload_from_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: fpl-vortex-day-1
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      DAY1_OUTPUT_ROOT: ${{ github.workspace }}/.day1-upload
      DAY1_YOUTUBE_RECEIPT: ${{ github.workspace }}/.day1-upload/DATA/youtube_private_upload.json
    steps:
      - uses: actions/checkout@v7

      - name: Verify the source Day 1 run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.upload_from_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Enter the Actions run ID from the end of its URL."
            exit 1
          fi
          run_number="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '
            select(.path == ".github/workflows/day-1.yml" and .head_branch == "main"
                   and .event == "workflow_dispatch" and .conclusion == "success")
            | .run_number')"
          if [[ ! "$run_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Use a successful manual Day 1 production run from main."
            exit 1
          fi
          echo "artifact=day-1-output-$run_number" >> "$GITHUB_OUTPUT"

      - name: Download the saved Day 1 output
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.upload_from_run_id }}
          name: ${{ steps.source.outputs.artifact }}
          path: ${{ env.DAY1_OUTPUT_ROOT }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify and prepare the saved upload package
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from vortex.youtube_private_upload import PACKAGE_NAME, REPORT_NAME, _validate_package

          root = Path(os.environ["DAY1_OUTPUT_ROOT"])
          data = root / "DATA"
          package_path = data / PACKAGE_NAME
          package = json.loads(package_path.read_text(encoding="utf-8"))
          qa = json.loads((data / "final_video_qa.json").read_text(encoding="utf-8"))
          if qa.get("passed") is not True or qa.get("scene_count") != 5 or qa.get("video_output") != [3840, 2160]:
              raise SystemExit("The source artifact must contain a validated five-scene 4K video.")

          video = root / "MP4" / Path(package["video"]["file"]).name
          expected_hash = qa["external_media_integration"]["final_sha256"]
          with video.open("rb") as stream:
              if hashlib.file_digest(stream, "sha256").hexdigest() != expected_hash:
                  raise SystemExit("The saved MP4 hash does not match its final QA report.")

          # The package records the original runner path. Use the downloaded copy.
          package["video"]["file"] = video.name
          package_path.write_text(json.dumps(package, ensure_ascii=False), encoding="utf-8")
          _validate_package(root)
          (data / REPORT_NAME).unlink(missing_ok=True)
          PY

      - name: Install YouTube upload dependencies
        run: python -m pip install "google-api-python-client>=2.147,<3" "google-auth>=2.35,<3" "google-auth-httplib2>=0.2,<1"

      - name: Upload or reuse the existing private YouTube video
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python -m vortex.youtube_private_upload

      - name: Confirm PRIVATE YouTube video and show Studio link
        run: python -m vortex.day1_upload_status

      - name: Save upload receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day-1-upload-receipt-${{ github.run_number }}
          path: ${{ env.DAY1_YOUTUBE_RECEIPT }}
          if-no-files-found: ignore
          retention-days: 14

  editorial-contracts:
    name: Day 1 editorial contracts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing source-loader test dependencies
        run: python -m pip install "pandas>=2.2,<3" "numpy>=2.0,<3"
      - name: Compile the 33 untouched notebook-cell boundaries and check editorial binding
        run: python -m unittest discover -s tests -p 'test_day1_editorial_integration.py' -v
      - name: Compile Day 1 live editorial and packaging changes
        run: python -m py_compile vortex/day1_live_editorial.py vortex/day1_editorial.py vortex/day1_agenda.py vortex/youtube_studio_package.py
      - name: Verify live article extraction, player IDs, original narrator and agenda CSS
        run: python -m unittest discover -s tests -p 'test_day1_live_editorial.py' -v
      - name: Inspect live official-GW and external expert-source reachability (non-publishing)
        shell: bash
        run: |
          python -m vortex.day1_live_editorial --output "${RUNNER_TEMP}/day1-live-source.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          source = json.loads((Path(os.environ["RUNNER_TEMP"]) / "day1-live-source.json").read_text())
          print("[DAY1 LIVE SOURCE] GW", source.get("gameweek"), "status", source.get("status"))
          print("[DAY1 LIVE SOURCE] articles", len(source.get("articles") or []),
                "qualified opinion statements", len(source.get("opinions") or []))
          for op in source.get("opinions") or []:
              print("[DAY1 LIVE ADVICE]", op.get("author"), op.get("action"),
                    [p.get("name") for p in op.get("players") or []],
                    "article:", (op.get("url") or "").rsplit("/", 2)[-2])
          PY
      - name: Verify dynamic narratives, missing-data handling and exact captions
        run: python -m unittest discover -s tests -p 'test_day1_editorial.py' -v
      - name: Verify soft 7-minute pacing and natural Ryan voice
        run: python -m unittest discover -s tests -p 'test_day1_soft_duration.py' -v
      - name: Verify dynamic spoken intro agendas
        run: python -m unittest discover -s tests -p 'test_day1_agenda.py' -v
      - name: Verify source-aware Gameweek Brief contracts
        run: python -m unittest discover -s tests -p 'test_day1_brief.py' -v
      - name: Verify production intro TTS full-word contract
        run: python -m unittest discover -s tests -p 'test_day1_intro_voice_gate.py' -v
      - name: Prove original Day 1 cell exceptions surface clearly
        run: python -m unittest discover -s tests -p 'test_day1_runner_diagnostics.py' -v
      - name: Validate retrospective review manifest and legitimate script file
        run: python -m unittest discover -s tests -p 'test_day1_publish_contract.py' -v
      - name: Verify no duplicate private upload across seasons
        run: python -m unittest discover -s tests -p 'test_day1_season_dedup.py' -v
      - name: Day 1 player card contract
        run: python -m unittest discover -s tests -p 'test_day1_player_card.py' -v
      - name: Post-review market desk contracts
        run: python -m unittest discover -s tests -p 'test_day1_market_desk.py' -v
      - name: Preserve existing animation and review speech contracts
        run: |
          python -m unittest discover -s tests -p 'test_day1_review_contract.py' -v
          python -m unittest discover -s tests -p 'test_day1_narration_sync.py' -v
          python -m unittest discover -s tests -p 'test_day1_source_loader.py' -v

  hero-card-layout:
    name: Day 1 hero-card layout
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install layout runtime
        run: |
          python -m pip install "playwright>=1.46,<2"
          python -m playwright install --with-deps chromium
      - name: Audit review and post-review card frames
