          python tools/hero_card_audit/audit.py hero-card-qa
          DAY1_BRIEF_SCREENSHOT_DIR=hero-card-qa python -m unittest discover -s tests -p 'test_day1_brief_browser.py' -v
      - name: Save layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day1-hero-card-layout
          path: hero-card-qa
